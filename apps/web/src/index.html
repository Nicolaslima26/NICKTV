<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>ONIXPLUS</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://www.youtube-nocookie.com; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: file: data: blob:; font-src 'self' data:; media-src 'self' http: https: file: data: blob:; connect-src 'self' http: https: ws: wss: blob: data:; worker-src 'self' blob:"
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="ONIXPLUS" />
        <meta property="og:url" content="https://github.com/Nicolaslima26/NICKTV" />
        <meta
            property="og:image"
            content="assets/branding/onixplus-logo.png"
        />
        <meta
            property="og:description"
            content="ONIXPLUS is a modern player for IPTV sources supplied by the user."
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
        <script src="assets/app-config.js" defer></script>
        <style>
            /* Inline splash — paints immediately while the JS bundle and the
               styles.css (~300KB) are still downloading and Angular is
               bootstrapping. Removed from the DOM by main.ts after
               bootstrapApplication() resolves. No assets, zero extra HTTP. */
            #initial-splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #07080d;
                color: #e4e3e5;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                z-index: 99999;
            }
            #initial-splash .splash-logo {
                width: min(52vw, 420px);
                height: auto;
                object-fit: contain;
            }
            #initial-splash .splash-spinner {
                width: 28px;
                height: 28px;
                border: 3px solid rgba(198, 150, 245, 0.18);
                border-top-color: #9e5ef6;
                border-radius: 50%;
                animation: initial-splash-spin 0.9s linear infinite;
            }
            @keyframes initial-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #initial-splash .splash-spinner {
                    animation: none;
                    opacity: 0.6;
                }
            }
        </style>
    </head>
    <body class="mat-app-background">
        <div id="initial-splash" role="status" aria-label="Loading ONIXPLUS">
            <img
                class="splash-logo"
                src="assets/branding/onixplus-logo.png"
                alt="ONIXPLUS"
            />
            <span class="splash-spinner" aria-hidden="true"></span>
        </div>
        <app-root></app-root>
    </body>
</html>
